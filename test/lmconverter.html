<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title></title>
</head>
<body>
    <label>LatexMath
        <input type="text" id="txtLatex" placeholder="\sqrt{25}" /></label><br />
        <input type="button" id="btnConvert" name="btnConvert" value="convert" /><br />
    <h3>MathML:</h3>
    <pre id="output">
    </pre>

    <script type="module">
        import { LatexToMathML } from "../dist/latex.js";
        document.getElementById("btnConvert").onclick = function () {
            var latex = document.querySelector("#txtLatex").value;
            var MathML = LatexToMathML(latex);
            document.getElementById("output").innerText = MathML;
        };
    </script>
</body>
</html>
